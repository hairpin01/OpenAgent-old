format = 2

[module]
id = 'openagent'
scope = "inline"

[bundle]
source = 'Src'
entrypoint = "OpenAgentMain.py"
packages = ['OpenAgentLib']
locales = 'locales'
output = 'dist/OpenDebug.py'
debug_output = 'dist/OpenDebug.py'
release_output = 'dist/OpenAgent-MCUB-repo.py'
sign = true
fail_on_secrets = true

[hooks.debug]
post_build = ['python', 'scripts/notify_build.py']

[hooks.release]
post_build = [
    [
        'python',
        'scripts/copy_release.py',
        '{output}',
        '../repo-MCUB-fork/OpenAgent-MCUB-repo.py',
    ],
    ['bash', 'scripts/release_github.sh', '{output}'],
    ['python', 'scripts/notify_build.py'],
]
[lint]
auto = true
check_imports = true
strict_imports = true
enable = ["async", "decorators", "locales", "hooks"]
ignore = [".*", "dist/*"]
mcub_modules = ['aiohttp', 'core', 'telethon']
runtime_modules = ["openagent_system_tool_api"]

[lint.tools.debug]
ruff = false
black = true
mypy = false

[lint.tools.release]
ruff = true
black = true
mypy = false
