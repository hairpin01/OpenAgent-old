format = 2

[module]
id = "openagent"
name = "OpenAgent"
scope = "inline"
requires = ["aiohttp"]

[bundle]
source = "Src"
entrypoint = "OpenAgentMain.py"
sources = ["Settings.py"]
packages = ["OpenAgentLib"]
locales = "Locales"
output = "Dist/OpenDebug.py"
debug_output = "Dist/OpenDebug.py"
release_output = "Dist/OpenAgent-MCUB-repo.py"
sign = true
fail_on_secrets = false

[hooks.debug]
pre_build = ["python", "Scripts/configure_build_profile.py", "debug"]
post_build = [
    ["python", "Scripts/configure_build_profile.py", "release"],
    ["python", "Scripts/notify_build.py"],
]

[hooks.release]
pre_build = ["python", "Scripts/configure_build_profile.py", "release"]
post_build = [
    ["python", "Scripts/validate_release_api.py", "{output}", "../MCUB-fork"],
    ["python", "Scripts/copy_release.py", "{output}", "../repo-MCUB-fork/OpenAgent-MCUB-repo.py"],
    ["python", "Scripts/copy_release.py", "{output}", "../MCUB-fork/modules_loaded/OpenAgent.py"],
    ["bash", "Scripts/release_github.sh", "{output}"],
    ["python", "Scripts/notify_build.py"],
]

[lint]
auto = false
check_imports = false
strict_imports = false
ignore = [".*", "Dist/*"]

[lint.tools.debug]
ruff = false
black = true
mypy = false

[lint.tools.release]
ruff = false
black = true
mypy = false
